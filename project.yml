name: ScarabVault
options:
  bundleIdPrefix: com.scarabvault
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en-GB
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: 1,2
    GENERATE_INFOPLIST_FILE: true
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  ScarabVault:
    type: application
    platform: iOS
    sources:
    - Black
    - Sources
    - Resources
    - WidgetShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scarabvault.expedition
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Scarab Vault
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.puzzle-games
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        CODE_SIGN_ENTITLEMENTS: Support/App.entitlements
        INFOPLIST_FILE: Support/AppInfo.plist
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        CODE_SIGN_STYLE: Automatic
    dependencies:
    - target: ScarabVaultWidget
      embed: true
  ScarabVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - Tests
    dependencies:
    - target: ScarabVault
  ScarabVaultUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - UITests
    - WidgetTests/WidgetIntegrationTests.swift
    dependencies:
    - target: ScarabVault
  ScarabVaultWidget:
    type: app-extension
    platform: iOS
    sources:
    - WidgetShared
    - WidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scarabvault.expedition.widget
        INFOPLIST_FILE: WidgetExtension/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Support/Widget.entitlements
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        CODE_SIGN_STYLE: Automatic
  ScarabVaultWidgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - WidgetTests/WidgetTests.swift
    dependencies:
    - target: ScarabVault
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.scarabvault.expedition.widgettests
schemes:
  ScarabVault:
    build:
      targets:
        ScarabVault: all
    test:
      targets:
      - ScarabVaultTests
      - ScarabVaultUITests
      - ScarabVaultWidgetTests
